                </div>
                <p class="about-intro" data-about-field="fullBio"></p>

        <div class="about-sections">
            <section class="about-section" aria-labelledby="experienceTitle">
                <p class="about-number">01</p>

                <div class="about-timeline" id="aboutExperience"></div>

            <section class="about-section" aria-labelledby="educationTitle">
                <p class="about-number">05</p>
                <h2 id="educationTitle">教育背景</h2>
                <div class="about-timeline" id="aboutEducation"></div>
            </section>

            <section class="about-section" aria-labelledby="credentialsTitle">
                <p class="about-number">06</p>
                <h2 id="credentialsTitle">资质 / 荣誉</h2>
                <div class="about-credentials" id="aboutCredentials"></div>
            </section>

            <section class="about-section" aria-labelledby="contactTitle">

                <address class="about-contact" id="aboutContact"></address>

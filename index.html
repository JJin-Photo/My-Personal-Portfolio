<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="计代源（JJin）个人摄影作品集，展示风光、人像、街头、动物、剧照与调色作品。">
    <meta name="theme-color" content="#ffffff">
    <link rel="canonical" href="https://jjin-photo.github.io/My-Personal-Portfolio/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:title" content="计代源 JJin｜个人摄影作品集">
    <meta property="og:description" content="风光、人像、街头、动物、剧照与调色作品。">
    <meta property="og:url" content="https://jjin-photo.github.io/My-Personal-Portfolio/">
    <meta property="og:image" content="https://jjin-photo.github.io/My-Personal-Portfolio/assets/images/large/%E6%91%84%E5%BD%B1/%E9%A3%8E%E5%85%89/0%20%28105%29.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="计代源 JJin｜个人摄影作品集">
    <meta name="twitter:description" content="风光、人像、街头、动物、剧照与调色作品。">
    <meta name="twitter:image" content="https://jjin-photo.github.io/My-Personal-Portfolio/assets/images/large/%E6%91%84%E5%BD%B1/%E9%A3%8E%E5%85%89/0%20%28105%29.jpg">
    <title>计代源 JJin｜个人摄影作品集</title>
    <link rel="stylesheet" href="styles.css?v=17">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Han+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body data-page="home">
    <header class="header">
        <a class="logo" href="index.html" aria-label="JJin 主页">JJin</a>
        <nav class="nav" aria-label="主导航">
            <a href="index.html" class="nav-link active" aria-current="page">主页</a>
            <a href="works.html" class="nav-link">作品</a>
            <a href="about.html" class="nav-link">关于我</a>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深色主题" aria-pressed="false">🌙</button>
        </nav>
    </header>

    <main>
        <section class="hero" aria-labelledby="pageTitle">
            <div class="hero-content">
                <div class="hero-primary">
                    <div class="category-grid" aria-label="作品分类">
                        <div class="category-row">
                            <a href="works.html?category=photography" class="category-link"><span>01</span>摄影</a>
                            <a href="works.html?category=film" class="category-link"><span>02</span>胶片</a>
                        </div>
                        <div class="category-row">
                            <a href="works.html?category=stills" class="category-link"><span>03</span>剧照</a>
                            <a href="works.html?category=colorgrading" class="category-link"><span>04</span>调色</a>
                        </div>
                    </div>
                </div>
                <aside class="profile-preview" aria-label="关于摄影师">
                    <a class="profile-preview-link" href="about.html">
                        <span class="profile-kicker">个人简介</span>
                        <span class="profile-portrait" id="heroProfilePortrait"></span>
                        <span class="profile-copy">
                            <span class="profile-heading">
                                <h1 class="profile-name" id="pageTitle" data-about-field="name"></h1>
                                <span class="profile-role" data-about-field="role"></span>
                                <span class="profile-role-en" data-about-field="roleEn"></span>
                            </span>
                            <span class="profile-bio" data-about-field="shortBio"></span>
                            <span class="profile-cta">关于我 <span aria-hidden="true">↗</span></span>
                        </span>
                    </a>
                </aside>
            </div>
        </section>

        <section class="selected-works" aria-labelledby="selectedWorksTitle">
            <div class="section-header"><p>作品选集</p><h2 id="selectedWorksTitle">精选作品</h2></div>
            <div class="works-grid" id="worksGrid" aria-live="polite"></div>
        </section>
    </main>

    <footer class="footer"><p>&copy; 计代源作品集</p></footer>

    <button class="version-button" id="versionButton" type="button" aria-haspopup="dialog" aria-controls="changelogOverlay"></button>
    <div class="changelog-overlay" id="changelogOverlay" role="dialog" aria-modal="true" aria-labelledby="changelogTitle" hidden>
        <div class="changelog-dialog">
            <button class="changelog-close" id="changelogClose" type="button" aria-label="关闭更新日志">&times;</button>
            <h2 id="changelogTitle">网站更新</h2>
            <div class="changelog-list" id="changelogList"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDescription" hidden>
        <article class="modal-content">
            <button class="modal-close" id="modalClose" type="button" aria-label="关闭作品预览">&times;</button>
            <header class="modal-project-header">
                <span class="modal-project-index" id="modalIndex">01</span>
                <div class="modal-project-heading">
                    <span class="modal-project-kicker" id="modalCategory"></span>
                    <h2 id="modalTitle"></h2>
                    <p id="modalDescription"></p>
                </div>
                <dl class="modal-project-meta">
                    <div><dt>年份</dt><dd id="modalYear">—</dd></div>
                    <div><dt>类型</dt><dd id="modalType">—</dd></div>
                </dl>
            </header>
            <div class="modal-visual">
                <button class="modal-prev" id="modalPrev" type="button" aria-label="查看上一张图片">‹</button>
                <button class="modal-next" id="modalNext" type="button" aria-label="查看下一张图片">›</button>
                <div class="modal-main-image"><img id="modalImage" alt="" loading="lazy" decoding="async"><div class="modal-counter" id="modalCounter"></div></div>
            </div>
            <section class="comparison-section" id="comparisonSection" aria-labelledby="comparisonTitle" hidden>
                <div class="comparison-heading"><p>调色对比</p><h3 id="comparisonTitle">调色前 / 调色后</h3></div>
                <div class="comparison-stage" id="comparisonStage">
                    <img class="comparison-after" id="comparisonAfter" alt="调色后的画面" decoding="async">
                    <img class="comparison-before" id="comparisonBefore" alt="调色前的画面" decoding="async">
                    <span class="comparison-label comparison-label-before">调色前</span>
                    <span class="comparison-label comparison-label-after">调色后</span>
                    <span class="comparison-divider" aria-hidden="true"></span>
                    <input id="comparisonRange" type="range" min="0" max="100" value="50" aria-label="拖动查看调色前后对比">
                </div>
            </section>
            <div class="modal-actions" id="modalVideoSlot"></div>
            <div class="modal-thumbnails" id="modalThumbnails" aria-label="作品缩略图"></div>
        </article>
    </div>
    <script src="about-data.js?v=6"></script>
    <script src="works-data.js?v=10"></script>
    <script src="version.js?v=7"></script>
    <script src="script.js?v=12"></script>
</body>
</html>
